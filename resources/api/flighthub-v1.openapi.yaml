# RAC Flight Data Hub — Distribution API v1 (OpenAPI 3.1), maintained by hand.
# The complete INTERNAL document (D-054): not served; the public one is public-v1.openapi.yaml.
# Change both with the API:
# tests/Feature/ApiDocs check it against the routes, the field groups and real responses.
# Flight field descriptions are the AODB's (resources/aodb/openapi-3.2.5.json).
openapi: 3.1.0
info:
  title: RAC Flight Data Hub API
  version: 1.0.0
  summary: Kigali International Airport flight data, cleaned and versioned, for RAC systems.
  description: |
    The RAC Flight Data Hub collects the flight data of Kigali International Airport (HRYR)
    from the airport's AODB, cleans it, keeps every change and serves it to other RAC systems
    through this read-only API. Run by RAC IT.

    ## Keys and the Authorization header

    Every consumer system has its own key, issued by RAC IT. A key looks like
    `fdh_xxxxxxxx_…`; it is shown once when it is issued and the hub keeps only a hash of it.

    Send the key in the `Authorization` header of every call:

        Authorization: Bearer fdh_xxxxxxxx_…

    Never put the key in the URL: a key in the query string is ignored (and URLs end up in
    logs and browser histories). A missing, malformed, unknown, revoked or expired key, or a
    disabled consumer, always gets the same answer: `401 {"error": "UNAUTHORIZED"}`.

    On this page, **Authorize** takes a key for **Try it out**. The page keeps it in memory
    only (not in the browser's storage): it is gone when the page is reloaded. Calls made with
    Try it out are real API calls and are logged like any other.

    ## Field groups

    A consumer receives only the field groups RAC IT gave it. `identity` is always given. A
    field that is in none of the consumer's groups is never served: it is absent from the
    flight, absent from a flight's history, and its events are left out of `/changes`. A
    field in no group at all is never served to anyone, including fields the AODB adds later.
    Inside the consumer's groups, every top-level field is present; it is `null` when the AODB
    does not send it.

    Each field of the Flight schema below names its group in `x-field-group`. The groups:
    identity, route, schedule, times, acdm, resources, aircraft, passengers, delays,
    ground_handling, rotation, quality.

    Field descriptions come from the AODB's own documentation (Innov'ATM Airport Keeper
    External API 3.2.5). Values are served as the AODB sends them, except the corrected
    values listed in `hub.corrections`; formats the AODB documents but does not respect are
    reported in `hub.quality`, not changed.

    ## Times and days

    Every time is UTC, written `YYYY-MM-DDTHH:MM:SSZ`.

    - `day=YYYY-MM-DD` is a Kigali calendar day (Africa/Kigali, UTC+2): `day=2026-10-29` is
      2026-10-28T22:00:00Z up to 2026-10-29T22:00:00Z.
    - `from` and `to` give any other window: ISO-8601 date-times with a zone (`Z` or
      `+02:00`), half-open `[from, to)`, at most 7 days. KIA PULSE's operational day
      (07:00 → 07:00 Kigali) is `from=2026-10-29T05:00:00Z&to=2026-10-30T05:00:00Z`.
    - A flight is in a window when its reference time is: the scheduled time, else the
      estimated time, else the actual time (arrivals: sibt, eibt, eldt, aibt, aldt;
      departures: sobt, eobt, tobt, etot, aobt, atot). It is given in `hub.referenceTime`.

    ## Freshness: meta.asOf and "stale"

    `meta.asOf` is when the hub's last successful AODB poll finished. `meta.feed` is `stale`
    when that is more than 15 minutes ago (or when there has been none yet): the data may then
    be out of date. Otherwise it is `ok`. The hub polls the AODB every 5 minutes, so the time
    of a change is known to about 5 minutes.

    ## as_of: what the hub knew at a moment

    `as_of` on `/flights` gives the flights as the hub knew them at that moment, from the
    versions it kept, with the quality flags that were open then. It is what the hub knew,
    not what was true: a correction the AODB sent later does not appear in an answer for an
    earlier moment. `meta.requestedAsOf` repeats the moment asked for.

    ## Changes since: paging with the cursor

    `/changes` returns every change the hub recorded, in order, each with its `cursor`.
    Start with `cursor=0`, then call again with `cursor=` the `meta.nextCursor` of the last
    answer, and keep it once the events are processed. While `meta.hasMore` is true there is
    more to read.

    `meta.nextCursor` is the last event the hub **scanned**, not the last one it returned.
    Events on fields outside the consumer's groups are skipped, so a page can hold fewer
    events than `limit`, or none at all, while `nextCursor` still moves on. That is normal:
    events a consumer may not see never block it.

    Kinds of event:

    - `first_seen`: the hub saw the flight for the first time; `new` is the whole flight in
      the same shape as in `/flights` (its `hub.quality` is empty: flags are evaluated after
      that poll).
    - `field_changed`: one field changed. `field` is its AODB path (`eobt`,
      `paxDetails.pmr`, …) or a hub field (`hub.sameAs`, `hub.rotationNext`,
      `hub.rotationPrev`); `old` and `new` are its values. A list is compared as one value.
      A field the AODB stops sending changes to `null`.
    - `removed_from_feed` and `returned_to_feed`: see below.

    ## Duplicates and removed flights

    A flight's identity is its AODB `id`. The hub never merges flights by itself: it flags
    suspected duplicates and a person decides. A flight marked "same as" another gets
    `hub.sameAs` = the AODB id of the flight that is kept. It is then left out of `/flights`
    lists, but it stays reachable at `/flights/{aodbId}` and in `/changes` (field
    `hub.sameAs`).

    A flight that leaves the AODB feed is never deleted: it gets a `removed_from_feed` event
    and `hub.inFeed` becomes false. `/flights` leaves it out unless `include_removed=1`. If it
    comes back, it gets a `returned_to_feed` event.

    ## Where a value comes from: source

    Each event has a `source`:

    - `aodb`: the value the AODB sent.
    - `correction`: a served value corrected from a reviewed reference table (for example
      airport code NB0 → NBO). The AODB value is kept and shown in `hub.corrections`.
    - `manual`: a person's decision in the hub, for example "same as".
    - `system`: the hub's own conclusion, for example a flight removed from or returned to the
      feed, or a rotation linked by registration.
    - `backfill`: an event written when a past period is loaded afterwards (reserved; not
      used yet).

    ## Rate limits

    Each consumer has a number of calls per minute per key (set by RAC IT). Beyond it the hub
    answers `429 RATE_LIMITED` with a `Retry-After` header in seconds. Refused calls (401)
    count per IP address: after 30 in a minute, calls without a valid key from that address
    get 429 for the rest of the minute. A valid key is never blocked by that limit.

    ## Errors

    Every error is JSON `{"error": CODE, "message": text}`, never a stack trace:
    `UNAUTHORIZED` (401), `NOT_FOUND` (404: an unknown flight or path), `METHOD_NOT_ALLOWED`
    (405: any method other than GET or HEAD, with an `Allow` header), `INVALID_PARAMETER`
    (422), `RATE_LIMITED` (429), `SERVER_ERROR` (500).

    Every call is logged (consumer, path, parameters, status, time), never the key.
servers:
  - url: https://flightdata.rac.co.rw/api/v1
    description: Production
  - url: http://127.0.0.1:8000/api/v1
    description: Local testing (php artisan serve)
