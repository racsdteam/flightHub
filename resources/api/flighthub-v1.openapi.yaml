components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: fdh_…
      description: 'The consumer''s API key, in the Authorization header only: `Authorization: Bearer fdh_…`.'
  parameters:
    day:
      name: day
      in: query
      description: 'A Kigali calendar day (Africa/Kigali, UTC+2), YYYY-MM-DD, e.g. 2026-10-29. Not with from and to.'
      schema: {type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$'}
    from:
      name: from
      in: query
      description: 'Start of the window (included): ISO-8601 date-time with a zone, e.g. 2026-10-29T05:00:00Z. With to; not with day. The window is at most 7 days.'
      schema: {type: string, format: date-time}
    to:
      name: to
      in: query
      description: 'End of the window (excluded): ISO-8601 date-time with a zone after from, e.g. 2026-10-30T05:00:00Z. With from; not with day.'
      schema: {type: string, format: date-time}
    as_of:
      name: as_of
      in: query
      description: 'The flights as the hub knew them at this moment (ISO-8601 date-time with a zone). Omitted: now.'
      schema: {type: string, format: date-time}
    flow:
      name: flow
      in: query
      description: 'Only arrivals (ARR) or only departures (DEP). Omitted: both.'
      schema: {type: string, enum: [ARR, DEP]}
    include_removed:
      name: include_removed
      in: query
      description: '1 (or true): also the flights removed from the feed (hub.inFeed false). Default 0.'
      schema: {type: string, enum: ['0', '1', 'false', 'true'], default: '0'}
    history:
      name: history
      in: query
      description: '1 (or true): also the flight''s change events the consumer may see, in order. Default 0.'
      schema: {type: string, enum: ['0', '1', 'false', 'true'], default: '0'}
    cursor:
      name: cursor
      in: query
      required: true
      description: 0 for the first call, then the meta.nextCursor of the previous answer.
      schema: {type: integer, minimum: 0}
      example: 0
    limit:
      name: limit
      in: query
      description: 'Events scanned per call: default 500. Values above 1000 are reduced to 1000; anything that is not a positive whole number is refused (422).'
      schema: {type: integer, minimum: 1, default: 500}
    aodbId:
      name: aodbId
      in: path
      required: true
      description: 'The flight''s AODB id (up to 64 characters: letters, digits, ".", "_", ":", "-").'
      schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$'}
      example: 0af6b9d4-e030-40cd-aea5-108df1e6bae6
  headers:
    Retry-After:
      description: Seconds to wait before calling again.
      required: true
      schema: {type: integer, minimum: 1}
    Allow:
      description: The methods the API accepts.
      required: true
      schema: {type: string, const: 'GET, HEAD'}
  responses:
    Unauthorized:
      description: 'No valid key: missing, malformed, unknown, revoked or expired, or the consumer is disabled. Always the same answer.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              value: {error: UNAUTHORIZED, message: A valid API key is required.}
    NotFound:
      description: Unknown path under /api/v1.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value: {error: NOT_FOUND, message: Not found.}
    MethodNotAllowed:
      description: Any method other than GET or HEAD, on any /api/v1 path. The call is logged like any other.
      headers:
        Allow:
          $ref: '#/components/headers/Allow'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            post:
              summary: POST /flights
              value: {error: METHOD_NOT_ALLOWED, message: Method not allowed.}
    RateLimited:
      description: Too many calls in this minute (the key's limit, or 30 refused calls from this IP address).
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              value: {error: RATE_LIMITED, message: Too many requests.}
  schemas:
    Flight:
      type: object
      description: |
        A flight as the consumer may see it: the top-level fields of its groups (each present,
        null when the AODB does not send it; objects as the AODB sends them), corrected values
        under their AODB names, and the `hub` object. No other field is ever served.
      required: [id, flow, flightNumber, fullFlightNumber, airlineIata, airlineIcao, status, milestone, callsign, hub]
      additionalProperties: false
      properties:
        id:
          description: "Internal flight unique identifier (the AODB id: the flight's identity in the hub)"
          type: string
          x-field-group: identity
        flow:
          description: |-
            The flight flow at the airport:
            - ARR - arrival flight
            - DEP - departure flight
          type: string
          enum: [ARR, DEP]
          x-field-group: identity
        flightNumber:
          description: 'The flight number (only number part, excluding airline IATA code)'
          type: [string, 'null']
          x-field-group: identity
        fullFlightNumber:
          description: 'The full flight number including airline IATA code'
          type: [string, 'null']
          x-field-group: identity
        airlineIata:
          description: 'The flight airline IATA code (2-letters or letter+digit)'
          type: [string, 'null']
          x-field-group: identity
        airlineIcao:
          description: 'The flight airline ICAO code (3-letters)'
          type: [string, 'null']
          x-field-group: identity
        status:
          description: |-
            The flight global status:
            - SCHEDULED - flight is scheduled but not yet airborne
            - IN_FLIGHT - flight is airborne
            - SUSPENDED - flight is suspended by the network manager
            - TERMINATED - flight has terminated
            - CANCELLED - flight is cancelled
            - NONE - undefined
          type: [string, 'null']
          x-field-group: identity
        milestone:
          description: |-
            The flight milestone:
            - SCHEDULED - for ARR flight: flight is scheduled but not yet airborne; for DEP flight: preceding arrival flight is scheduled but not yet airborne
            - AIRBORNE - for ARR flight only: flight is airborne
            - FIR_ENTRY - for ARR flight only: flight entered FIR
            - FINAL - for ARR flight only: flight is in final approach
            - LANDED - for ARR flight only: flight has landed
            - IN_BLOCK - for ARR flight only: flight is at the block
            - NO_IN_BLOCK - for DEP flight only: preceding arrival flight is airborne or landed but not yet at the block
            - ON_BLOCK - for DEP flight only: preceding arrival flight is at the block but the departure operations have not yet started
            - START_BOARDING - for DEP flight only: boarding started
            - AC_READY - for DEP flight only: the aircraft is ready for departure
            - OK_START - for DEP flight only: the aircraft was given clearance to depart
            - OFF_BLOCK - for DEP flight only: the flight has left the block
            - TAKE_OFF - for DEP flight only: the flight has taken off
          type: [string, 'null']
          x-field-group: identity
        callsign:
          description: 'The flight ATC callsign'
          type: [string, 'null']
          x-field-group: identity
        adepIata:
          description: |-
            The flight departure airport IATA code (3-letters)
            Served value: may be corrected from a reviewed reference table; the AODB value is then in hub.corrections.
          type: [string, 'null']
          x-field-group: route
        adepIcao:
          description: |-
            The flight departure airport ICAO code (4-letters)
            Served value: may be corrected from a reviewed reference table; the AODB value is then in hub.corrections.
          type: [string, 'null']
          x-field-group: route
        adesIata:
          description: |-
            The flight destination airport IATA code (3-letters)
            Served value: may be corrected from a reviewed reference table; the AODB value is then in hub.corrections.
          type: [string, 'null']
          x-field-group: route
        adesIcao:
          description: |-
            The flight destination airport ICAO code (4-letters)
            Served value: may be corrected from a reviewed reference table; the AODB value is then in hub.corrections.
          type: [string, 'null']
          x-field-group: route
        adepDetails:
          description: 'The additional details on departure airport (for ARR flight only)'
          anyOf: [{ $ref: '#/components/schemas/AdepDetailsDto' }, { type: 'null' }]
          x-field-group: route
        adesDetails:
