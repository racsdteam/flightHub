paths:
  /flights:
    get:
      tags: [Flights]
      operationId: listFlights
      summary: Flights of a Kigali day or of a time window
      description: |
        The flights whose reference time is in the window, sorted by reference time. Give
        either `day`, or `from` and `to`. Flights marked "same as" another are left out;
        flights removed from the feed are left out unless `include_removed=1`.
      parameters:
        - $ref: '#/components/parameters/day'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/as_of'
        - $ref: '#/components/parameters/flow'
        - $ref: '#/components/parameters/include_removed'
      responses:
        '200':
          description: The flights, with only the consumer's field groups.
          content:
