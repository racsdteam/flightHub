          format: date-time
        actualOpenTime:
          description: 'The gate actual open time, in ISO date-time format'
          type: [string, 'null']
          format: date-time
        estimatedCloseTime:
          description: 'The gate estimated close time, in ISO date-time format'
          type: [string, 'null']
          format: date-time
        actualCloseTime:
          description: 'The gate actual close time, in ISO date-time format'
          type: [string, 'null']
          format: date-time
        status:
          description: |-
            The resource open / close status (applied for check-in, gate, boarding, baggage belt):
            - NOT_STARTED - the action requiring the resource not started yet
            - OPEN - the resource is open / action has started
            - CLOSED - the resource is closed / the action has terminated
          type: [string, 'null']
    GhrAssistanceDto:
      type: object
      description: 'The aggregated GHR assistance model containing GHR assistance units required for the flight'
      properties:
        selected:
          description: 'The selected assistance units among the predefined list'
          type: [array, 'null']
          items: { $ref: '#/components/schemas/AssistanceUnitDto' }
        other:
          description: 'Any other assistances not present in the predefined list'
          type: [string, 'null']
    GhrOperatorDto:
      type: object
      description: 'The GHR operator information model (email, phone, address, zipcode and city removed by the hub, D-035)'
      properties:
        name:
          description: 'The operator name'
          type: [string, 'null']
        country:
          description: 'The operator addess country'
          type: [string, 'null']
        id:
          description: 'The operator identification code'
          type: [string, 'null']
    GhrRecordDto:
      type: object
      description: 'The GHR record progress model'
      properties:
        status:
          description: |-
            The GHR flight record progress status:
            - ADDED - the record was created and is in progress
            - TERMINATED - the record is terminated (all required actions fulfilled)
          type: [string, 'null']
        assistanceValidated:
          description: 'The indicator if the GHR assistance was validated'
          type: [boolean, 'null']
    PaxDetailsDto:
      type: object
      description: 'The passengers details model'
      properties:
        estimated:
          description: 'The estimated number of passengers'
          type: [integer, 'null']
          format: int32
          minimum: 0
        um:
          description: 'The number of Unaccompanied Minors'
          type: [integer, 'null']
          format: int32
          minimum: 0
        pmr:
          description: 'The number of Persons with Reduced Mobility'
          type: [integer, 'null']
          format: int32
          minimum: 0
        vip:
          description: 'The number of VIP passengers'
          type: [integer, 'null']
          format: int32
          minimum: 0
        other:
          description: 'The number of passengers of other exceptional categories'
          type: [integer, 'null']
          format: int32
          minimum: 0
        remarks:
          description: 'Any remarks conserning passengers'
          type: [string, 'null']
    RegulationDto:
      type: object
      description: 'The most penalizing regulation model'
      required:
        - regul
      properties:
        regul:
          description: 'The regulation ID (as defined by the network provider)'
          type: [string, 'null']
        cause:
          description: 'The regulation cause (code defined by the network provider)'
          type: [string, 'null']
        reason:
          description: 'The regulation reason (among the predefied values defined by the network provider)'
          type: [string, 'null']
        description:
          description: 'The regulation description (providing more details on regulation reason)'
          type: [string, 'null']
        remark:
          description: 'The regulation remark (providing more details on regulation reason in arbitrary format)'
          type: [string, 'null']
    VttDto:
      type: object
      description: 'The Variable Taxi Times (VTT) model'
      properties:
        estimated:
          description: 'The estimated VTT, in minutes'
          type: [integer, 'null']
          format: int32
          minimum: 0
        actual:
          description: 'The actual VTT, in minutes'
          type: [integer, 'null']
          format: int32
          minimum: 0
