          x-field-group: aircraft
        quality:
          description: The data-quality flags open on this flight (now, or at as_of). Flags only; the values are not changed.
          type: array
          items:
            $ref: '#/components/schemas/QualityFlag'
          x-field-group: quality
        corrections:
          description: The served values that differ from what the AODB sent, with the reference row that corrected them.
          type: array
          items:
            $ref: '#/components/schemas/Correction'
          x-field-group: quality
    QualityFlag:
      type: object
      required: [rule, field, since]
      additionalProperties: false
      properties:
        rule:
          description: 'The rule, for example format_invalid, required_missing, no_actual_after_schedule, actual_early, in_flight_stale, duplicate_suspected, type_missing, capacity_missing, stand_unknown.'
          type: string
        field:
          description: The AODB field concerned, or null when the flag is about the flight as a whole.
          type: [string, 'null']
        since:
          description: When the flag was raised (or raised again).
          type: string
          format: date-time
    Correction:
      type: object
      required: [field, aodb, served, reference]
      additionalProperties: false
      properties:
        field:
          description: The AODB path of the corrected field.
          type: string
        aodb:
          description: The value the AODB sent (null when it sent none).
        served:
          description: The value served under the field's name.
        reference:
          description: 'The reference row that gave the value, by its natural key (airport_code_corrections:NB0, aircraft_types:<airline>/<type>), or null.'
          type: [string, 'null']
    ChangeEvent:
      type: object
      required: [cursor, aodbId, observedAt, kind, field, old, new, source]
      additionalProperties: false
      properties:
        cursor:
          description: The event's position; give the last one you processed (meta.nextCursor) as cursor.
          type: integer
          minimum: 1
        aodbId:
          description: The flight's AODB id.
          type: string
        observedAt:
          description: When the hub observed the change (UTC; polls every 5 minutes).
          type: string
          format: date-time
        kind:
          description: first_seen, field_changed, removed_from_feed or returned_to_feed.
          type: string
          enum: [first_seen, field_changed, removed_from_feed, returned_to_feed]
        field:
          description: 'field_changed: the AODB path (eobt, paxDetails.pmr, …) or hub field (hub.sameAs, hub.rotationNext, hub.rotationPrev). null for the other kinds.'
          type: [string, 'null']
        old:
          description: The value before (null when there was none). A list is one value.
        new:
          description: 'The value after (null when the field disappeared). first_seen: the whole flight, as in /flights.'
        source:
          description: 'aodb, correction, manual, system or backfill (see "Where a value comes from").'
          type: string
          enum: [aodb, correction, manual, system, backfill]
    Meta:
      type: object
      description: Freshness of the data, in every answer.
      required: [asOf, feed]
      properties:
        asOf:
          description: When the last successful AODB poll finished; null when there has been none.
          type: [string, 'null']
          format: date-time
        feed:
          description: stale when asOf is more than 15 minutes ago (or null), else ok.
          type: string
          enum: [ok, stale]
    FlightListMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
      required: [window, requestedAsOf]
      unevaluatedProperties: false
      properties:
        window:
          description: The window used, [from, to) in UTC.
          type: object
          required: [from, to]
          additionalProperties: false
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
        requestedAsOf:
          description: The as_of asked for, or null.
          type: [string, 'null']
          format: date-time
    ChangeListMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
      required: [cursor, limit, nextCursor, hasMore, headCursor]
      unevaluatedProperties: false
      properties:
        cursor:
          description: The cursor asked for.
          type: integer
          minimum: 0
        limit:
          description: Events scanned at most in this call.
          type: integer
          minimum: 1
          maximum: 1000
        nextCursor:
          description: The last event scanned (not the last returned); the cursor for the next call. Equal to cursor when nothing was scanned.
          type: integer
          minimum: 0
        hasMore:
          description: true when events after nextCursor exist.
          type: boolean
        headCursor:
          description: The newest event's cursor (0 when there is none).
          type: integer
          minimum: 0
    PlainMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
      unevaluatedProperties: false
    Health:
      type: object
      required: [asOf, feed, lastPoll]
      additionalProperties: false
      properties:
        asOf:
          description: When the last successful AODB poll finished; null when there has been none.
          type: [string, 'null']
          format: date-time
        feed:
          description: stale when asOf is more than 15 minutes ago (or null), else ok.
          type: string
          enum: [ok, stale]
        lastPoll:
          description: The last poll, successful or not; null before the first.
          oneOf:
            - type: 'null'
            - type: object
              required: [outcome, finishedAt]
              additionalProperties: false
              properties:
                outcome:
                  description: 'ok, or why the poll failed: invalid_payload, http_error, timeout, auth_error, login_backoff, forbidden, config_error, rate_limited.'
                  type: string
                finishedAt:
                  type: [string, 'null']
                  format: date-time
    FlightList:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Flight'
        meta:
          $ref: '#/components/schemas/FlightListMeta'
    FlightOne:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Flight'
        history:
          description: With history=1 only.
          type: array
          items:
            $ref: '#/components/schemas/ChangeEvent'
        meta:
          $ref: '#/components/schemas/PlainMeta'
    ChangeList:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ChangeEvent'
        meta:
          $ref: '#/components/schemas/ChangeListMeta'
    HealthOne:
      type: object
      required: [data, meta]
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Health'
        meta:
          $ref: '#/components/schemas/PlainMeta'
    Error:
      type: object
      required: [error, message]
      additionalProperties: false
      properties:
        error:
          description: 'The error code: UNAUTHORIZED, NOT_FOUND, METHOD_NOT_ALLOWED, INVALID_PARAMETER, RATE_LIMITED, SERVER_ERROR (or HTTP_<status> for another refusal by the web server layer).'
          type: string
          anyOf:
            - enum: [UNAUTHORIZED, NOT_FOUND, METHOD_NOT_ALLOWED, INVALID_PARAMETER, RATE_LIMITED, SERVER_ERROR]
            - pattern: '^HTTP_[0-9]{3}$'
        message:
          description: A short explanation, for people.
          type: string
    AdepDetailsDto:
      type: object
      description: 'The additional details on departure airport (for ARR flight only)'
      properties:
        adepName:
          description: 'The full name of the departure airport'
          type: [string, 'null']
        firstAdepIata:
          description: 'The initial departure airport IATA code (3-letters) in case of stopover'
          type: [string, 'null']
        firstAdepIcao:
          description: 'The initial departure airport ICAO code (4-letters) in case of stopover'
          type: [string, 'null']
    AdesDetailsDto:
      type: object
      description: 'The additional details on arrival airport (for DEP flight only)'
      properties:
        adesName:
          description: 'The full name of the arrival airport'
          type: [string, 'null']
        lastAdesIata:
          description: 'The final arrival airport IATA code (3-letters) in case of stopover'
          type: [string, 'null']
        lastAdesIcao:
          description: 'The final arrival airport ICAO code (4-letters) in case of stopover'
          type: [string, 'null']
    AircraftDetailsDto:
      type: object
      description: 'The additional aircraft details'
      properties:
        acTypeName:
          description: 'The full name of the aircraft type'
          type: [string, 'null']
        wtc:
          description: |-
            The aircraft Wake Turbulence Category (WTC)
            - J - jumbo
            - H - heavy
            - M - medium
            - L - light
          type: [string, 'null']
        mtow:
          description: 'The aircraft Maximum Takeoff Weight (MTOW), in tons'
          type: [integer, 'null']
          format: int32
          minimum: 0
    AssistanceUnitDto:
      type: object
      description: 'The GHR single assistance unit model'
      required:
        - type
      properties:
        type:
          description: 'The predefined assistance type'
          type: [string, 'null']
        remark:
          description: 'Any supplementary information / description'
          type: [string, 'null']
    BaggageCheckInDetailsDto:
      type: object
      description: 'The baggage check-in details model (for DEP flight only)'
      properties:
        belt:
          description: 'The baggage check-in belt'
          type: [string, 'null']
        inspectionSystem:
          description: 'The baggage inspection system (Inspection Filtrage Bagages en Soute, IFBS)'
          type: [string, 'null']
    BaggageDeliveryDetailsDto:
      type: object
      description: 'The baggage delivery details model (for ARR flight only)'
      properties:
        openTime:
          description: 'The belt open time, in ISO date-time format'
          type: [string, 'null']
          format: date-time
        closeTime:
          description: 'The belt close time, in ISO date-time format'
          type: [string, 'null']
          format: date-time
        firstBagTime:
          description: 'The first bag time, in ISO date-time format'
          type: [string, 'null']
          format: date-time
        lastBagTime:
          description: 'The last bag time, in ISO date-time format'
          type: [string, 'null']
          format: date-time
        status:
          description: |-
            The resource open / close status (applied for check-in, gate, boarding, baggage belt):
            - NOT_STARTED - the action requiring the resource not started yet
            - OPEN - the resource is open / action has started
            - CLOSED - the resource is closed / the action has terminated
          type: [string, 'null']
    BoardingDetailsDto:
      type: object
      description: 'The boarding details model (for DEP flight only)'
      properties:
        startTime:
          description: 'The start boarding time, in ISO date-time format'
          type: [string, 'null']
          format: date-time
        endTime:
          description: 'The end boarding time, in ISO date-time format'
          type: [string, 'null']
          format: date-time
        status:
          description: |-
            The resource open / close status (applied for check-in, gate, boarding, baggage belt):
            - NOT_STARTED - the action requiring the resource not started yet
            - OPEN - the resource is open / action has started
            - CLOSED - the resource is closed / the action has terminated
          type: [string, 'null']
    CheckInDetailsDto:
      type: object
      description: 'The check-in details model (for DEP flight only)'
      properties:
        openTime:
          description: 'The check-in open time, in ISO date-time format'
          type: [string, 'null']
          format: date-time
        closeTime:
          description: 'The check-in close time, in ISO date-time format'
          type: [string, 'null']
          format: date-time
        status:
          description: |-
            The resource open / close status (applied for check-in, gate, boarding, baggage belt):
            - NOT_STARTED - the action requiring the resource not started yet
            - OPEN - the resource is open / action has started
            - CLOSED - the resource is closed / the action has terminated
          type: [string, 'null']
    CodeShareDto:
      type: object
      description: 'The airline code sharing details model'
      properties:
        operatingAirlineIata:
          description: 'The operating airline IATA code (2-letters or letter+digit)'
          type: [string, 'null']
        operatingAirlineIcao:
          description: 'The operating airline ICAO code (3-letters)'
          type: [string, 'null']
        flightNumbers:
          type: [array, 'null']
          items: { type: string }
    DivertedDetailsDto:
      type: object
      description: 'The additional details on arrival airport in case flight is diverted'
      properties:
        filedAdesIata:
          description: 'The initially filed arrival airport IATA code (3-letters) in case flight is diverted'
          type: [string, 'null']
        filedAdesIcao:
          description: 'The initially filed arrival airport ICAO code (4-letters) in case flight is diverted'
          type: [string, 'null']
        divertedAdesIata:
          description: 'The result diverted arrival airport IATA code (3-letters) in case flight is diverted'
          type: [string, 'null']
        divertedAdesIcao:
          description: 'The result diverted arrival airport ICAO code (4-letters) in case flight is diverted'
          type: [string, 'null']
    DlCodeDto:
      type: object
      description: 'The enhanced DL code model'
      required:
        - code
      properties:
        code:
          description: 'The DL code'
          type: [string, 'null']
        delay:
          description: 'The delay (in minutes)'
          type: [integer, 'null']
          format: int32
          minimum: 0
        info:
          description: 'Any supplementary information / description'
          type: [string, 'null']
    DlCodesDto:
      type: object
      description: 'The aggregated DL codes model containing DL codes separated by types'
      properties:
        aodb:
          description: 'The list of DL codes received from AODB'
          type: [array, 'null']
          items: { $ref: '#/components/schemas/DlCodeDto' }
        typeb:
          description: 'The list of DL codes received via TYPE-B messages'
          type: [array, 'null']
          items: { $ref: '#/components/schemas/DlCodeDto' }
        ais:
          description: 'The list of DL codes declared via AK AIS'
          type: [array, 'null']
          items: { $ref: '#/components/schemas/DlCodeDto' }
    FlightZoneDetailsDto:
      type: object
      description: 'The additional details on different flight zones'
      properties:
        paxZone:
          description: 'The pax zone (depending on flight origin / destination / nationality)'
          type: [string, 'null']
        parkingZone:
          description: 'The parking zone (depending on the parking)'
          type: [string, 'null']
        gateZone:
          description: 'The gate zone (depending on the gate) (for DEP flight only)'
          type: [string, 'null']
    GateDetailsDto:
      type: object
      description: 'The gate openning details model (for DEP flight only)'
      properties:
