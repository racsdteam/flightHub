        Change events with a cursor greater than `cursor`, in order, at most `limit` scanned
        per call. Events on fields outside the consumer's groups are left out, and
        `meta.nextCursor` still moves past them (see "Changes since" above).
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: The events the consumer may see, and where to continue.
          content:
